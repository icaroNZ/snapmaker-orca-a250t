name: Check profiles
on: 
  pull_request:
    branches: 
    - main 
    paths:
    - 'resources/profiles/**'
    - 'submodules/Profiles'
    - 'submodules/Profiles/**'
    - '.gitmodules'
    - 'CMakeLists.txt'
    - 'cmake/SyncSnapmakerProfiles.cmake'
    - ".github/workflows/check_profiles.yml"

  workflow_dispatch:
    inputs:
      logLevel:
        description: 'Log level'     
        required: true
        default: 'warning'


jobs:
  check_translation:
    name: Check profiles
    runs-on: ubuntu-24.04
    steps:  
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Sync Snapmaker profiles
        run: |
          cmake -DSUB="$PWD/submodules/Profiles" \
                -DDST="$PWD/resources/profiles" \
                -DVERSION_STAMP="$RUNNER_TEMP/profiles-revision.txt" \
                -P cmake/SyncSnapmakerProfiles.cmake

      - name: Run extra JSON check
        run: |
          python3 ./scripts/orca_extra_profile_check.py

      # Strict: the Snapmaker bundle's own static validator (inherits chains, compatible_printers,
      # default_*_profile, Snapmaker.json index, filament rule files) for the A250/A350 presets this
      # fork ships. Findings for other Snapmaker printers are reported but do not fail the job.
      - name: Validate Snapmaker A250/A350 profiles (snapmaker-profiles validator)
        run: |
          python3 -I ./submodules/Profiles/scripts/validate_profiles.py \
            --root ./submodules/Profiles \
            --orca-filament-library ./resources/profiles/OrcaFilamentLibrary

      # download
      - name: Download 
        working-directory: ${{ github.workspace }}
        run: |
          curl -LJO https://github.com/SoftFever/Orca_tools/releases/download/1/OrcaSlicer_profile_validator
          chmod +x ./OrcaSlicer_profile_validator

      # validate profiles
      # Informational only. This is SoftFever's upstream OrcaSlicer validator, not Snapmaker's
      # (src/dev-utils/Snapmaker_Orca_profile_validator.cpp). It lacks Snapmaker's setting_id ->
      # filament_id fallback for system filaments (src/libslic3r/PresetBundle.cpp, load_vendor_configs_from_json),
      # so it aborts the Snapmaker vendor on the first "Generic ... @U1" filament that only has setting_id,
      # and it also enforces upstream rules (printer_variant vs nozzle_diameter, OrcaFilamentLibrary bases)
      # that ~15 unrelated vendors bundled from upstream fail. Its log is kept for reference; the strict
      # check of the Snapmaker vendor with Snapmaker's own validator runs in build_orca.yml (Ubuntu).
      - name: validate system profiles (upstream validator, informational)
        continue-on-error: true
        run: |
          ./OrcaSlicer_profile_validator -p ${{ github.workspace }}/resources/profiles -l 2




